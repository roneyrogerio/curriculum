name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: curriculum-release-please
  cancel-in-progress: false

jobs:
  release:
    name: Open or land the release pull request
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # Documented as required by the action, which labels the release pull
      # request through the issues API.
      issues: write
    steps:
      # Keeps a release PR open with the next version and the changelog; merging
      # it tags the release. Versions come from Conventional Commits on main.
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
