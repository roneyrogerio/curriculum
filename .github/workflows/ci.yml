name: CI

# Publicar é consequência de um release, não de um push.
#
# Um push para main verifica o código e deixa o pull request de versão em dia,
# sem publicar nada. Ao juntar esse pull request, o release-please cria a tag e
# o release, e só então o deploy acontece — uma vez, e sempre correspondendo a
# uma versão com changelog.
#
# O deploy lê a saída do release-please em vez de escutar a tag: eventos
# disparados pelo GITHUB_TOKEN não iniciam novas execuções, então um workflow
# que escutasse a tag simplesmente nunca rodaria.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: curriculum-ci
  # Nunca cancelar no meio: uma interrupção durante o kubectl apply deixaria o
  # cluster num estado parcial.
  cancel-in-progress: false

jobs:
  verify:
    name: Checks, tests and ATS validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Unit tests
        run: npm test

      # O build escreve o PDF e o DOCX a partir de src/data, então eles são
      # validados depois dele em vez de serem carregados no repositório.
      - name: Build
        run: npm run build

      - name: Validate ATS artifacts
        run: npm run validate:ats

  release:
    name: Open or land the release pull request
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # Documentada como necessária pela action, que rotula o pull request de
      # versão pela API de issues.
      issues: write
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  deploy:
    name: Build image and deploy to Kubernetes
    needs: [verify, release]
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set image metadata
        id: meta
        shell: bash
        env:
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          OWNER_LC="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          IMAGE_BASE="ghcr.io/${OWNER_LC}/curriculum"
          {
            echo "image_base=${IMAGE_BASE}"
            echo "image_sha=${IMAGE_BASE}:${GITHUB_SHA}"
            echo "image_tag=${IMAGE_BASE}:${TAG}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ steps.meta.outputs.image_sha }}
            ${{ steps.meta.outputs.image_tag }}
            ${{ steps.meta.outputs.image_base }}:latest

      - name: Set up kubectl
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4
        with:
          # Fixa: com 'latest', uma mudança no kubectl entraria no deploy sem
          # ninguém ter pedido.
          version: v1.31.4

      - name: Write OCI credentials
        shell: bash
        env:
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_USER: ${{ secrets.OCI_USER }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_TENANCY: ${{ secrets.OCI_TENANCY }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
        run: |
          : "${OCI_PRIVATE_KEY:?OCI_PRIVATE_KEY secret is required}"
          : "${OCI_USER:?OCI_USER secret is required}"
          : "${OCI_FINGERPRINT:?OCI_FINGERPRINT secret is required}"
          : "${OCI_TENANCY:?OCI_TENANCY secret is required}"
          : "${OCI_REGION:?OCI_REGION secret is required}"
          mkdir -p "$HOME/.oci"
          printf "%s\n" "$OCI_PRIVATE_KEY" > "$HOME/.oci/oci_api_key.pem"
          chmod 600 "$HOME/.oci/oci_api_key.pem"
          printf '[DEFAULT]\nuser=%s\nfingerprint=%s\ntenancy=%s\nregion=%s\nkey_file=%s\n' \
            "$OCI_USER" "$OCI_FINGERPRINT" "$OCI_TENANCY" "$OCI_REGION" "$HOME/.oci/oci_api_key.pem" > "$HOME/.oci/config"
          chmod 600 "$HOME/.oci/config"

      - name: Install OCI CLI
        shell: bash
        run: |
          python -m pip install --user oci-cli
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Configure kubeconfig from OKE
        shell: bash
        env:
          OKE_CLUSTER_ID: ${{ secrets.OKE_CLUSTER_ID }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
        run: |
          : "${OKE_CLUSTER_ID:?OKE_CLUSTER_ID secret is required}"
          : "${OCI_REGION:?OCI_REGION secret is required}"
          mkdir -p "$HOME/.kube"
          oci ce cluster create-kubeconfig \
            --cluster-id "$OKE_CLUSTER_ID" \
            --file "$HOME/.kube/config" \
            --region "$OCI_REGION" \
            --token-version 2.0.0 \
            --kube-endpoint PUBLIC_ENDPOINT
          chmod 600 "$HOME/.kube/config"

      - name: Create GHCR pull secret
        shell: bash
        env:
          GHCR_USER: ${{ secrets.GHCR_USER }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_EMAIL: ${{ secrets.GHCR_EMAIL }}
        run: |
          : "${GHCR_USER:?GHCR_USER secret is required}"
          : "${GHCR_TOKEN:?GHCR_TOKEN secret is required}"
          : "${GHCR_EMAIL:?GHCR_EMAIL secret is required}"
          kubectl create namespace curriculum --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret docker-registry ghcr-secret \
            --docker-server=ghcr.io \
            --docker-username="$GHCR_USER" \
            --docker-password="$GHCR_TOKEN" \
            --docker-email="$GHCR_EMAIL" \
            -n curriculum \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy to Kubernetes
        shell: bash
        run: |
          kubectl apply -f deploy/namespace.yaml
          kubectl apply -f deploy/cluster-domain-claim.yaml
          kubectl apply -f deploy/domain-mapping.yaml
          sed -E "s|^([[:space:]]*image:[[:space:]]*).*$|\\1${{ steps.meta.outputs.image_sha }}|" deploy/curriculum.yaml | kubectl apply -f -
          kubectl -n curriculum wait ksvc/curriculum --for=condition=Ready --timeout=180s

      - name: Report deployed revision
        if: always()
        shell: bash
        env:
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          {
            echo "## Publicado: ${TAG}"
            echo
            kubectl -n curriculum get ksvc curriculum -o wide || true
          } >> "$GITHUB_STEP_SUMMARY"
