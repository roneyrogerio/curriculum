apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: curriculum
  namespace: curriculum
  labels:
    app.kubernetes.io/name: curriculum
    app.kubernetes.io/component: web
    app.kubernetes.io/managed-by: github-actions
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/name: curriculum
      annotations:
        # One replica is always warm, so the first visit never pays a cold start.
        autoscaling.knative.dev/minScale: "1"
        # Bounded on purpose: a static site on a small cluster should not be able
        # to scale until it starves everything else on the node.
        autoscaling.knative.dev/maxScale: "3"
        autoscaling.knative.dev/target: "100"
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        # The pipeline replaces this tag with the immutable commit SHA; the
        # floating tag is only a fallback for a manual `kubectl apply`.
        - name: curriculum
          image: ghcr.io/roneyrogerio/curriculum:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            # Stated here as well as in the image, so the guarantee does not
            # depend on reading the Dockerfile to know which user it runs as.
            runAsUser: 1000
            runAsGroup: 1000
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 8080
          env:
            # Injected at runtime from a Secret the pipeline writes, so the key
            # is never baked into the image: the image is public on GHCR, and a
            # build argument would sit readable in its layer history forever.
            # `optional: true` keeps the site serving if the Secret is absent —
            # only the tailoring route answers 503, instead of every page
            # failing because one feature is unconfigured.
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openai-secret
                  key: api-key
                  optional: true
          resources:
            requests:
              # Raised from 25m/32Mi: the container is a Node process now, not
              # NGINX serving files. The floor is what the runtime needs before
              # it serves anything.
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /pt-br/
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /pt-br/
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
