apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: curriculum
  namespace: curriculum
  labels:
    app.kubernetes.io/name: curriculum
    app.kubernetes.io/component: web
    app.kubernetes.io/managed-by: github-actions
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/name: curriculum
      annotations:
        # One replica is always warm, so the first visit never pays a cold start.
        autoscaling.knative.dev/minScale: "1"
        # Bounded on purpose: a static site on a small cluster should not be able
        # to scale until it starves everything else on the node.
        autoscaling.knative.dev/maxScale: "3"
        autoscaling.knative.dev/target: "100"
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        # The pipeline replaces this tag with the immutable commit SHA; the
        # floating tag is only a fallback for a manual `kubectl apply`.
        - name: curriculum
          image: ghcr.io/roneyrogerio/curriculum:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /pt-br/
            initialDelaySeconds: 1
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /pt-br/
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
